name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlserver-localdb:
    name: SQL Server LocalDB (EF Core 10)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify and start current-user LocalDB
        shell: pwsh
        run: |
          $localDbTool = (Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue).Source
          if (-not $localDbTool) {
            $localDbTool = Get-ChildItem "$env:ProgramFiles\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe" -File -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $localDbTool) {
            throw 'SQL Server LocalDB is required. Install the official LocalDB/Visual Studio SQL.LocalDB.Runtime component; see https://learn.microsoft.com/sql/database-engine/configure-windows/sql-server-express-localdb. Tests will not be skipped.'
          }
          & $localDbTool versions
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect installed LocalDB versions.' }
          $instances = & $localDbTool info
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect current-user LocalDB instances.' }
          if ($instances -notcontains 'MSSQLLocalDB') {
            & $localDbTool create MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create current-user MSSQLLocalDB instance.' }
          }
          $instanceInfo = & $localDbTool info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect MSSQLLocalDB.' }
          if (($instanceInfo -join "`n") -notmatch 'State:\s+Running') {
            & $localDbTool start MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) { throw 'Cannot start MSSQLLocalDB.' }
          }
          & $localDbTool info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect running MSSQLLocalDB.' }

      - name: Restore SQL Server tests
        run: dotnet restore tests/Raffinert.Expressions.EntityFrameworkCore.SqlServerTests/Raffinert.Expressions.EntityFrameworkCore.SqlServerTests.csproj

      - name: Execute SQL Server tests
        run: dotnet test tests/Raffinert.Expressions.EntityFrameworkCore.SqlServerTests/Raffinert.Expressions.EntityFrameworkCore.SqlServerTests.csproj -c Release --no-restore --logger "trx;LogFileName=sqlserver-localdb.trx" --logger "console;verbosity=detailed"

      - name: Check SQL Server test formatting
        run: dotnet format tests/Raffinert.Expressions.EntityFrameworkCore.SqlServerTests/Raffinert.Expressions.EntityFrameworkCore.SqlServerTests.csproj --no-restore --verify-no-changes

      - name: Upload SQL Server test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sqlserver-localdb-windows
          path: 'tests/Raffinert.Expressions.EntityFrameworkCore.SqlServerTests/TestResults/*.trx'
          if-no-files-found: warn

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Raffinert.Expressions.slnx

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format Raffinert.Expressions.slnx --no-restore --verify-no-changes

      - name: Test
        run: dotnet test Raffinert.Expressions.slnx --configuration Release --no-restore

      - name: Pack
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/Raffinert.Expressions/Raffinert.Expressions.csproj --configuration Release --no-restore --output artifacts/package
          dotnet pack src/Raffinert.Expressions.QuerySyntax/Raffinert.Expressions.QuerySyntax.csproj --configuration Release --no-restore --output artifacts/package
          dotnet pack src/Raffinert.Expressions.EntityFrameworkCore/Raffinert.Expressions.EntityFrameworkCore.csproj --configuration Release --no-restore --output artifacts/package

      - name: Upload package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
          if-no-files-found: error

  efcore-compatibility:
    name: EF Core ${{ matrix.ef }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        ef: ['7.0.20', '8.0.31', '9.0.20', '10.0.11']
        include:
          - ef: '7.0.20'
            runtime-sdk: '6.0.x'
            framework: net6.0
            project: tests/Raffinert.Expressions.EntityFrameworkCore.CompatibilityTests/Ef7/Ef7.csproj
          - ef: '8.0.31'
            runtime-sdk: '8.0.x'
            framework: net8.0
            project: tests/Raffinert.Expressions.EntityFrameworkCore.CompatibilityTests/Ef8/Ef8.csproj
          - ef: '9.0.20'
            runtime-sdk: '8.0.x'
            framework: net8.0
            project: tests/Raffinert.Expressions.EntityFrameworkCore.CompatibilityTests/Ef9/Ef9.csproj
          - ef: '10.0.11'
            runtime-sdk: '10.0.x'
            framework: net10.0
            project: tests/Raffinert.Expressions.EntityFrameworkCore.IntegrationTests/Raffinert.Expressions.EntityFrameworkCore.IntegrationTests.csproj

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install compatibility runtime and repository SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: ${{ matrix.runtime-sdk }}

      - name: Test EF compatibility
        run: dotnet test ${{ matrix.project }} --configuration Release --logger "trx;LogFileName=efcore-${{ matrix.ef }}.trx"

      - name: Pack local consumer dependencies
        run: |
          dotnet pack src/Raffinert.Expressions/Raffinert.Expressions.csproj -c Release --output artifacts/pr7-packages
          dotnet pack src/Raffinert.Expressions.EntityFrameworkCore/Raffinert.Expressions.EntityFrameworkCore.csproj -c Release --output artifacts/pr7-packages

      - name: Restore isolated package consumer
        run: dotnet restore tests/Raffinert.Expressions.EntityFrameworkCore.PackageSmoke/PackageSmoke.csproj -p:TargetFramework=${{ matrix.framework }} -p:EfCoreVersion=${{ matrix.ef }}

      - name: Run isolated package consumer
        run: dotnet run --project tests/Raffinert.Expressions.EntityFrameworkCore.PackageSmoke/PackageSmoke.csproj -c Release --no-restore -p:TargetFramework=${{ matrix.framework }} -p:EfCoreVersion=${{ matrix.ef }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: efcore-${{ matrix.ef }}-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
